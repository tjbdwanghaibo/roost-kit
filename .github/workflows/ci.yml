name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go test ./...
      - run: go vet ./...
        # The Redis-backed suites are build-tagged, so `go vet ./...` and
        # `go test ./...` never see them. Vetting with the tag keeps them
        # compiling on every push; RUNNING them is the `integration` job.
      - name: vet integration-tagged tests
        run: go vet -tags integration ./...
      - run: go run github.com/tjbdwanghaibo/roost-core/cmd/glsvet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # Runs every integration-tagged test against a real Redis. Before this job
  # existed, three files (mail, rank, integration/) carried the tag and a
  # REDIS_ADDR gate, and no automation ever set the variable: 32 tests were
  # green by never running. The last step turns a silent skip into a failure.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: integration-tagged tests on Redis
        run: |
          set -o pipefail
          go test -tags integration -count=1 -json ./... | tee test.json \
            | jq -r 'select(.Test==null and (.Action=="pass" or .Action=="fail")) | .Action + "\t" + .Package'
      - name: failing test output (on failure)
        if: failure()
        run: jq -r 'select(.Action=="output") | .Output' test.json | grep -vE '^(=== RUN|--- PASS|PASS|ok )' | tail -200
      - name: no Redis test was skipped
        run: |
          skipped=$(jq -r 'select(.Action=="output" and (.Output|test("REDIS_ADDR"))) | .Package + " " + .Test' test.json | sort -u)
          if [ -n "$skipped" ]; then
            echo "these tests skipped because REDIS_ADDR was unset — the job must run them:"
            echo "$skipped"
            exit 1
          fi
      - name: race on the Redis-backed suites
        run: go test -tags integration -count=1 -race ./integration/ ./mail/ ./rank/

  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: root module has no local replace
        run: |
          if grep -Eq '^[[:space:]]*replace([[:space:]]|\()' go.mod; then
            echo "release module must not contain replace directives"
            grep -nE '^[[:space:]]*replace([[:space:]]|\()' go.mod
            exit 1
          fi
      - name: tagged release uses tagged framework dependencies
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if grep -Eq 'tjbdwanghaibo/roost-[a-z]+ v[0-9]+\.[0-9]+\.[0-9]+-0\.[0-9]{14}-[0-9a-f]{12}' go.mod; then
            echo "tagged releases must not depend on framework pseudo-versions"
            grep -nE 'tjbdwanghaibo/roost-[a-z]+ v[0-9]+\.[0-9]+\.[0-9]+-0\.[0-9]{14}-[0-9a-f]{12}' go.mod
            exit 1
          fi
      - name: module path resolves
        run: |
          mod=$(head -1 go.mod | awk '{print $2}')
          base=$(echo "$mod" | sed -E 's#/v[0-9]+$##')
          echo "module: $mod (repo: $base)"
          git ls-remote "https://${base}.git" HEAD
      - name: tag matches module major
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mod=$(head -1 go.mod | awk '{print $2}')
          tag=${GITHUB_REF#refs/tags/}
          major=$(echo "$tag" | sed -E 's#^v([0-9]+)\..*#\1#')
          suffix=$(echo "$mod" | grep -oE '/v[0-9]+$' | tr -d '/v' || true)
          if [ "$major" -ge 2 ]; then want="$major"; else want=""; fi
          if [ "${suffix:-}" != "${want}" ]; then
            echo "tag $tag requires module suffix '/v${want}' but go.mod has '${suffix:+/v$suffix}'"
            exit 1
          fi
